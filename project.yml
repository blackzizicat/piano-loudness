name: PianoLoudness
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  PianoLoudness:
    type: application
    platform: iOS
    sources:
      - Sources/PianoLoudness
    info:
      path: Sources/PianoLoudness/Info.plist
      properties:
        CFBundleDisplayName: Piano Loudness
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryAddUsageDescription: Save the processed video to Photos.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pianoloudness
  PianoLoudnessTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/PianoLoudnessTests
    dependencies:
      - target: PianoLoudness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pianoloudness.tests
