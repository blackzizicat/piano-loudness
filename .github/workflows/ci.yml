name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project PianoLoudness.xcodeproj \
            -scheme PianoLoudness \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log
      - name: Summarize
        if: always()
        run: |
          grep -E "error:|Test Case .* (passed|failed)|Executed [0-9]+ tests" xcodebuild.log | sort -u | head -9 | while IFS= read -r line; do echo "::notice::$line"; done
